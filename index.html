<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VIP의 다음 목적지 · BIGBANG 20TH DESTINATION MAP</title>
<meta property="og:title" content="VIP의 다음 목적지" />
<meta property="og:description" content="VIP가 만든 빅뱅 20주년 콘서트·전시·팬 이벤트 맵 (내 여정 저장도 됨)" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://20th-vipmap.vercel.app/" />
<meta property="og:image" content="https://20th-vipmap.vercel.app/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  :root{
    --sign:#FFC21A; --ink:#111; --card:#16130c; --cardline:#3a3325;
    --txt:#f4efe2; --sub:#b7ad95; --chip:#241f16; --chipact:#FFC21A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d0b07;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--txt)}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.7}
  /* Zoom control: sit just below the top bar (under 지도 공유) with a small gap */
  .maplibregl-ctrl-top-right{margin-top:98px;margin-right:12px}
  .maplibregl-ctrl-top-right .maplibregl-ctrl button{width:34px;height:34px}
  /* Defer to the user's global custom cursor: neutralize map/library/button cursors so it wins everywhere */
  .maplibregl-canvas-container.maplibregl-interactive,
  .maplibregl-canvas-container.maplibregl-interactive:active,
  .maplibregl-canvas, .maplibregl-canvas:active,
  .vip-marker, .chip, .btn, #card .close, #journeyPill, .jrow, #journey .jclose{cursor:inherit !important}

  /* Top bar */
  /* NOTE: do NOT use pointer-events:none here — iOS/WebKit won't deliver taps to
     pointer-events:auto children of a pointer-events:none parent (breaks filter chips on mobile). */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px);
    background:linear-gradient(#0d0b07ee,#0d0b0700)}
  #brand{display:flex;align-items:center;gap:8px}
  #brand .badge{width:26px;height:26px;transform:rotate(45deg);background:var(--sign);border:2px solid var(--ink);border-radius:5px;flex:0 0 auto}
  #brand h1{font-size:15px;margin:0;letter-spacing:.5px;font-weight:800}
  #brand small{display:block;font-size:10px;color:var(--sub);letter-spacing:1px;font-weight:600}
  #filters{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
  .chip{pointer-events:auto;touch-action:manipulation;border:none;background:var(--chip);color:var(--txt);font-size:12px;font-weight:700;
    padding:7px 12px;border-radius:999px;cursor:pointer;opacity:.92}
  .chip.active{background:var(--chipact);color:#111}
  #sharemap{margin-left:auto;background:#241f16;color:var(--sign);border:1px solid var(--sign)}

  /* Marker */
  .vip-marker{position:relative;width:46px;height:46px;background-size:contain;background-repeat:no-repeat;background-position:center;
    cursor:pointer;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));transition:opacity .18s ease, filter .18s ease}
  /* NOTE: never use transform on hover — MapLibre uses the element's transform for positioning */
  .vip-marker:hover{filter:drop-shadow(0 5px 7px rgba(0,0,0,.6)) brightness(1.08)}
  .vip-marker.dim{opacity:.22;filter:grayscale(.7) drop-shadow(0 2px 3px rgba(0,0,0,.4))}
  .vip-marker.visited::after{content:'✓';position:absolute;right:-5px;top:-5px;width:20px;height:20px;line-height:17px;
    text-align:center;font-size:12px;font-weight:900;color:#0d0b07;background:#7bd88f;border:2px solid #0d0b07;border-radius:50%}

  /* My VIP journey */
  #journeyPill{position:absolute;left:12px;bottom:26px;z-index:6;background:#16130ce6;border:1px solid var(--sign);color:var(--txt);
    border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:118px}
  #journeyPill #jpText{font-size:12px;font-weight:800;letter-spacing:.3px}
  #jpBar{height:4px;background:#3a3325;border-radius:2px;overflow:hidden}
  #jpBar>i{display:block;height:100%;background:var(--sign);width:0;transition:width .3s}
  #journey{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#000a;padding:20px}
  #journey.open{display:flex}
  #journey .box{position:relative;background:var(--card);border:1px solid var(--cardline);border-radius:16px;max-width:360px;width:100%;padding:22px;max-height:82vh;overflow:auto}
  #journey h3{margin:0 0 4px;font-size:16px}
  #journey .jsub{margin:0 0 14px;color:var(--sub);font-size:11px;line-height:1.5}
  .jbig{font-size:30px;font-weight:900;color:var(--sign);line-height:1}
  .jbig span{font-size:15px;color:var(--sub);font-weight:700}
  .jbar{height:8px;background:#3a3325;border-radius:4px;overflow:hidden;margin:12px 0 16px}
  .jbar>i{display:block;height:100%;background:var(--sign);width:0;transition:width .3s}
  .jlist{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .jrow{display:flex;align-items:center;gap:10px;background:#221d14;border:1px solid var(--cardline);color:var(--txt);
    padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;font-weight:700}
  .jrow.on{border-color:#7bd88f}
  .jrow .jck{width:20px;height:20px;flex:0 0 auto;border-radius:50%;border:1.5px solid #4a432f;background:transparent;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#0d0b07}
  .jrow.on .jck{background:#7bd88f;border-color:#7bd88f}
  #journey .jclose{position:absolute;top:10px;right:12px;background:#00000055;border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}

  /* Card */
  #card{position:absolute;z-index:10;background:var(--card);border:1px solid var(--cardline);
    transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
  #card.open{transform:none}
  #card .grab{display:none}
  #card .body{padding:18px 18px 20px;overflow-y:auto}
  .catrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cat{font-size:11px;font-weight:800;letter-spacing:1px;color:#111;background:var(--sign);padding:3px 8px;border-radius:5px}
  .status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;border:1px solid var(--cardline);color:var(--sub)}
  .status.live{color:#111;background:#7bd88f;border-color:#7bd88f}
  .status.soon{color:#111;background:#FFC21A;border-color:#FFC21A}
  .status.closed{color:#e6b0b0;background:#3a1f1f;border-color:#5a2a2a}
  #card h2{margin:6px 0 2px;font-size:19px;line-height:1.25}
  #card .venue{color:var(--sub);font-size:13px;margin:0 0 2px}
  #card .date{font-size:14px;font-weight:700;margin:10px 0 2px}
  #card .sub{color:var(--sub);font-size:12px;margin:0}
  #card .open-note{font-size:12px;color:var(--sign);font-weight:700;margin:8px 0 0}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;
    padding:12px;border-radius:11px;font-size:14px;font-weight:700;border:1px solid var(--cardline);color:var(--txt);background:#221d14;cursor:pointer}
  .btn.primary{background:var(--sign);color:#111;border-color:var(--sign)}
  .btn.naver{background:#03c75a;color:#fff;border-color:#03c75a}
  .btn.ghost{background:transparent}
  .btnrow{display:flex;gap:8px}
  .btnrow .btn{flex:1}
  #card .close{position:absolute;top:10px;right:12px;z-index:2;background:#00000055;border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}

  #disclaimer{position:absolute;bottom:0;left:0;right:0;z-index:3;text-align:center;font-size:10px;color:#8a8168;
    padding:5px 10px;background:#0d0b07cc;pointer-events:none;line-height:1.5}

  #toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);z-index:30;
    background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;border:1px solid var(--sign)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Mobile: bottom sheet */
  @media (max-width:719px){
    #card{left:0;right:0;bottom:0;max-height:74vh;border-radius:20px 20px 0 0;border-bottom:none}
    #card .grab{display:block;width:40px;height:4px;background:#4a432f;border-radius:2px;margin:9px auto 0}
    #disclaimer{bottom:0}
  }
  /* Desktop: side panel */
  @media (min-width:720px){
    #card{top:0;right:0;bottom:0;width:380px;border-radius:0;border-right:none;border-top:none;border-bottom:none;
      transform:translateX(110%)}
    #card.open{transform:none}
    #topbar{max-width:calc(100% - 0px)}
  }
</style>
</head>

<div id="map"></div>

<div id="topbar">
  <div id="brand">
    <div class="badge"></div>
    <div><h1>VIP의 다음 목적지</h1><small>BIGBANG 20TH DESTINATION MAP</small></div>
  </div>
  <div id="filters">
    <button class="chip active" data-f="all">전체</button>
    <button class="chip" id="sharemap">지도 공유</button>

</div>

<div id="card">

</div>

<div id="journeyPill" title="나의 VIP 여정"><span id="jpText">나의 여정 0</span><div id="jpBar"><i></i></div></div>

    <h3>나의 VIP 여정</h3>

    <div id="jBody"></div>

</div>

function statusClass(s){ if(s==='reservation_scheduled')return 'soon'; if(s==='reservation_closed')return 'closed'; if(s==='open')return 'live'; return ''; }
function fmtRange(ev){
  if(!ev.start) return '일정 미정';
  const f=(d)=>{const p=d.split('-');return `${p[0]}.${p[1]}.${p[2]}`;};
  return ev.start===ev.end ? f(ev.start) : `${f(ev.start)} — ${f(ev.end)}`;
}

function openCard(slug,fly){
  const {ev}=markers[slug];
  Object.values(markers).forEach(o=>o.el.classList.remove('active'));
  const canBook = (ev.status==='reservation_scheduled' || ev.status==='open') && ev.naverHasReservation;

  const homeBtn = ev.homepageUrl ? `<a class="btn ghost" href="${ev.homepageUrl}" target="_blank" rel="noopener">공식 출처 · 홈페이지</a>` : '';
  const calBtn = ev.start ? `<button class="btn" onclick="addCal('${ev.slug}')">📅 캘린더에 추가</button>` : '';

    <h2>${esc(ev.title.ko)}</h2>
    <p class="venue">${esc(ev.venue.ko)}</p>

      <div class="btnrow">
        <a class="btn" href="${ev.googleMapsUrl}" target="_blank" rel="noopener">Google Maps</a>

      <button class="btn ghost" onclick="sharePlace('${ev.slug}')">이 장소 공유하기</button>
      ${homeBtn}
    </div>`;
  document.getElementById('card').classList.add('open');
  if(fly) map.flyTo({center:[ev.lng,ev.lat],zoom:14,speed:1.2});
  history.replaceState(null,'',`?event=${ev.slug}`);
}
function closeCard(){document.getElementById('card').classList.remove('open');history.replaceState(null,'',location.pathname);}

  Object.values(markers).forEach(o=>{
    const show = f==='all' || o.ev.category===f;
    o.el.style.display = show ? '' : 'none'; if(show) shown++;   // hide non-matching markers (clearer than dimming on mobile)
  });
  if(f!=='all' && shown===0) toast(f==='fan' ? '팬 주최 제보가 등록되면 여기에 표시돼요' : '아직 등록된 장소가 없어요');
}
// bind click AND touchend: some mobile browsers suppress the synthesized click over the map overlay,
// so touchend is a reliable fallback. applyFilter is idempotent, so double-firing is harmless.
document.querySelectorAll('.chip[data-f]').forEach(c=>{
  const fire=(e)=>{ if(e && e.cancelable) e.preventDefault(); applyFilter(c.dataset.f); };
  c.addEventListener('click',fire);
  c.addEventListener('touchend',fire);
});

// Share
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
async function shareUrl(url,title,text){
  if(navigator.share){try{await navigator.share(text?{title,text,url}:{title,url});return;}catch(e){}}
  const payload = text ? (text+'\n'+url) : url;
  try{await navigator.clipboard.writeText(payload);toast('복사했어요');}catch(e){prompt('복사',payload);}
}
function sharePlace(slug){const {ev}=markers[slug];shareUrl(location.origin+location.pathname+'?event='+slug,'VIP의 다음 목적지 · '+ev.title.ko);}
document.getElementById('sharemap').onclick=()=>shareUrl(location.origin+location.pathname,'VIP의 다음 목적지 · BIGBANG 20TH DESTINATION MAP');

// .ics calendar (all-day; end is exclusive so +1 day)
function addCal(slug){
  const {ev}=markers[slug];
  const d=(s)=>s.replaceAll('-','');
  const plus1=(s)=>{const dt=new Date(s+'T00:00:00Z');dt.setUTCDate(dt.getUTCDate()+1);return dt.toISOString().slice(0,10).replaceAll('-','');};
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VIP SIGHTING MAP//KR','BEGIN:VEVENT',
    'UID:'+slug+'@vipmap','SUMMARY:'+ev.title.ko,'LOCATION:'+ev.address.ko,
    'DESCRIPTION:'+(ev.naverUrl||''),'DTSTART;VALUE=DATE:'+d(ev.start),'DTEND;VALUE=DATE:'+plus1(ev.end),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=slug+'.ics';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('캘린더 파일을 저장했어요');
}

// ---- My VIP Journey (device-local, no server) ----
let visited = new Set();
try { visited = new Set(JSON.parse(localStorage.getItem('vip_visited')||'[]')); } catch(e){}
function saveVisited(){ try{ localStorage.setItem('vip_visited', JSON.stringify([...visited])); }catch(e){} }

function toggleVisited(slug){
  if(visited.has(slug)) visited.delete(slug); else visited.add(slug);
  saveVisited();
  Object.entries(markers).forEach(([s,o])=>o.el.classList.toggle('visited', visited.has(s)));
  const b=document.getElementById('visitBtn');
  if(b && b.dataset.slug===slug){ const on=visited.has(slug); b.classList.toggle('primary',on); b.textContent=on?'✓ 다녀온 곳':'다녀왔어요'; }
  updateJourney();
}
function updateJourney(){
  const total=EVENTS.events.length, n=[...visited].filter(s=>markers[s]).length;
  document.getElementById('jpText').textContent=`나의 여정 ${n}`;
  document.querySelector('#jpBar>i').style.width=(total?Math.round(n/total*100):0)+'%';
  if(document.getElementById('journey').classList.contains('open')) renderJourney();
}
function renderJourney(){
  const total=EVENTS.events.length, n=[...visited].filter(s=>markers[s]).length;
  const list=EVENTS.events.map(ev=>{
    const on=visited.has(ev.slug);
    const label = (ev.short&&ev.short.ko) ? ev.short.ko : ev.title.ko;
    return `<button class="jrow ${on?'on':''}" onclick="toggleVisited('${ev.slug}')">
      <span class="jck">${on?'✓':''}</span><span>${esc(label)}</span></button>`;
  }).join('');
  document.getElementById('jBody').innerHTML=
    `<div class="jbig">${n} <span>/ ${total} 곳</span></div>
     <div class="jbar"><i style="width:${total?Math.round(n/total*100):0}%"></i></div>
     <div class="jlist">${list}</div>
     <button class="btn primary" onclick="shareJourney()">나의 여정 공유하기</button>`;
}
function shareJourney(){
  const total=EVENTS.events.length, n=[...visited].filter(s=>markers[s]).length;
  shareUrl(location.origin+location.pathname, 'VIP의 다음 목적지',
    `나는 빅뱅 20주년 VIP 여정 ${total}곳 중 ${n}곳 다녀왔어요 🐾`);
}
document.getElementById('journeyPill').onclick=()=>{ document.getElementById('journey').classList.add('open'); renderJourney(); };
document.querySelector('#journey .jclose').onclick=()=>document.getElementById('journey').classList.remove('open');
document.getElementById('journey').addEventListener('click',e=>{ if(e.target.id==='journey') document.getElementById('journey').classList.remove('open'); });
Object.entries(markers).forEach(([s,o])=>o.el.classList.toggle('visited', visited.has(s)));
updateJourney();
</script>
